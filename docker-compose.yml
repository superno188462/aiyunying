name: aiyunying
services:
  # --------------------------------------------------------------------------
  # Spider_XHS Application
  # --------------------------------------------------------------------------
  app:
    image: aiyunying:${IMAGE_TAG:-local}
    build:
      context: .
    init: true
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${APP_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - app_storage:/app/backend/app/storage
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中填写 PostgreSQL 连接地址}
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中填写固定的随机密钥}
      FRONTEND_SERVE_STATIC: "true"
      FRONTEND_BUILD_DIR: /app/frontend/dist
      CONFIG_FILE: /app/config/default.yaml
      TZ: Asia/Shanghai
    restart: unless-stopped
    stop_grace_period: 5m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  app_data:
  app_storage:
